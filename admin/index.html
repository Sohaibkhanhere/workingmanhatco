<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workin' Man Hat Co. — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="icon" href="https://images.squarespace-cdn.com/content/v1/6890bae40faa362f5af230e2/1754520881053-GITP2B476NHFI441CJ5Y/IMG_3617.jpeg?format=150w">
</head>
<body>

<!-- ==================== LOGIN VIEW ==================== -->
<div id="login-view" class="login-page">
  <div class="login-card">
    <img src="https://images.squarespace-cdn.com/content/v1/6890bae40faa362f5af230e2/1754520881053-GITP2B476NHFI441CJ5Y/IMG_3617.jpeg?format=300w" alt="Workin' Man Hat Co." class="login-logo">
    <h1>Workin' Man Hat Co.</h1>
    <p class="login-subtitle">Admin Dashboard</p>
    <form id="login-form">
      <div class="form-group">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" required placeholder="admin@workinman.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" required placeholder="Enter password" autocomplete="current-password">
      </div>
      <div id="loginError" class="error-message" style="display:none;"></div>
      <button type="submit" id="login-btn" class="btn btn-primary btn-block">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        Sign In
      </button>
    </form>
  </div>
</div>

<!-- ==================== ADMIN VIEW ==================== -->
<div id="admin-view" class="admin-layout" style="display:none;">

  <!-- Hamburger (mobile) -->
  <button id="hamburger" class="hamburger-btn" aria-label="Toggle menu" aria-expanded="false">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>

  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <img src="https://images.squarespace-cdn.com/content/v1/6890bae40faa362f5af230e2/1754520881053-GITP2B476NHFI441CJ5Y/IMG_3617.jpeg?format=100w" alt="Logo" class="sidebar-logo">
      <span class="sidebar-brand">Workin' Man</span>
    </div>
    <nav class="sidebar-nav">
      <a href="#" class="nav-item active" data-page="dashboard">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span>Dashboard</span>
      </a>
      <a href="#" class="nav-item" data-page="products">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
        <span>Products</span>
      </a>
      <a href="#" class="nav-item" data-page="orders">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span>Orders</span>
      </a>
      <a href="#" class="nav-item" data-page="content">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        <span>Content</span>
      </a>
      <a href="#" class="nav-item" data-page="media">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        <span>Media</span>
      </a>
      <a href="#" class="nav-item" data-page="settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>Settings</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <a href="../index.html" target="_blank" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        <span>View Store</span>
      </a>
      <button id="logout-btn" class="nav-item logout-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>Logout</span>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main id="admin-content" class="main-content">
    <!-- Top Bar -->
    <header class="topbar">
      <div class="topbar-left">
        <div id="breadcrumb" class="breadcrumb">
          <span class="breadcrumb-item">Admin</span>
          <span class="breadcrumb-sep">/</span>
          <span class="breadcrumb-current">Dashboard</span>
        </div>
        <h2 id="pageTitle" class="page-title" style="display:none;"></h2>
      </div>
      <div class="topbar-right">
        <div class="admin-info">
          <div class="admin-avatar">SS</div>
          <div class="admin-user-info">
            <span id="admin-user-name">Admin</span>
            <span id="admin-user-role" class="text-muted text-sm">admin</span>
          </div>
        </div>
      </div>
    </header>

    <!-- ==================== DASHBOARD ==================== -->
    <div class="admin-section" id="section-dashboard" style="display:block;">
      <div id="dashboard-content"></div>
    </div>

    <!-- ==================== PRODUCTS ==================== -->
    <div class="admin-section" id="section-products" style="display:none;">
      <div id="products-content"></div>
    </div>

    <!-- ==================== ORDERS ==================== -->
    <div class="admin-section" id="section-orders" style="display:none;">
      <div id="orders-content"></div>
    </div>

    <!-- ==================== CONTENT ==================== -->
    <div class="admin-section" id="section-content" style="display:none;">
      <div id="content-content"></div>
    </div>

    <!-- ==================== MEDIA ==================== -->
    <div class="admin-section" id="section-media" style="display:none;">
      <div id="media-content"></div>
    </div>

    <!-- ==================== SETTINGS ==================== -->
    <div class="admin-section" id="section-settings" style="display:none;">
      <div id="settings-content"></div>
    </div>

  </main>
</div>

<!-- ==================== PRODUCT MODAL ==================== -->
<div id="product-modal" class="modal" style="display:none;">
  <div class="modal-overlay"></div>
  <div class="modal-content modal-lg">
    <div class="modal-header">
      <h3 id="product-modal-title">Add Product</h3>
      <button class="modal-close" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <form id="product-form">
        <div class="form-row">
          <div class="form-group"><label for="product-name">Title *</label><input type="text" id="product-name" required placeholder="Product name"></div>
          <div class="form-group"><label for="product-slug">Slug</label><input type="text" id="product-slug" placeholder="auto-generated"></div>
        </div>
        <div class="form-group"><label for="product-description">Description</label><textarea id="product-description" rows="4" placeholder="Product description..."></textarea></div>
        <div class="form-row">
          <div class="form-group"><label for="product-price">Price *</label><input type="number" id="product-price" step="0.01" min="0" required placeholder="0.00"></div>
          <div class="form-group"><label for="product-compare-price">Compare At Price</label><input type="number" id="product-compare-price" step="0.01" min="0" placeholder="0.00"></div>
          <div class="form-group"><label for="product-sku">SKU</label><input type="text" id="product-sku" placeholder="SKU-001"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label for="product-category">Category</label>
            <select id="product-category"><option value="Hats">Hats</option><option value="Apparel">Apparel</option><option value="Accessories">Accessories</option><option value="New Arrivals">New Arrivals</option></select>
          </div>
          <div class="form-group"><label for="product-stock">Stock</label><input type="number" id="product-stock" min="0" value="0"></div>
        </div>
        <div class="form-row">
          <label class="checkbox-label"><input type="checkbox" id="product-featured"> Featured</label>
          <label class="checkbox-label"><input type="checkbox" id="product-active" checked> Active</label>
        </div>

        <div class="section-divider">
          <h4>Sizes</h4>
          <button type="button" id="add-size-btn" class="btn btn-sm btn-outline">+ Add Size</button>
        </div>
        <div id="sizes-container"></div>

        <div class="section-divider">
          <h4>Colors</h4>
          <div class="color-input-row">
            <input type="text" id="color-input" class="form-input" placeholder="Type color name and press Enter">
          </div>
        </div>
        <div id="color-tags" class="tags-container"></div>

        <div class="section-divider">
          <h4>Images</h4>
          <button type="button" id="add-image-btn" class="btn btn-sm btn-outline">+ Add URL</button>
        </div>
        <div id="image-urls"></div>
        <div id="image-preview-container" class="image-preview-grid"></div>

        <div class="section-divider">
          <button type="button" id="seo-toggle" class="btn btn-sm btn-outline">▸ SEO Settings</button>
        </div>
        <div id="seo-section" class="collapsed">
          <div class="form-group"><label for="seo-title">Meta Title</label><input type="text" id="seo-title" placeholder="SEO title"></div>
          <div class="form-group"><label for="seo-description">Meta Description</label><textarea id="seo-description" rows="2" placeholder="SEO description"></textarea></div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-ghost modal-close">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Product</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- ==================== ORDER MODAL ==================== -->
<div id="order-modal" class="modal" style="display:none;">
  <div class="modal-overlay"></div>
  <div class="modal-content modal-lg">
    <div class="modal-header">
      <h3>Order Details</h3>
      <button class="modal-close" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="order-detail-content">
      <p class="text-muted">Loading order...</p>
    </div>
  </div>
</div>

<!-- ==================== CONFIRM MODAL ==================== -->
<div id="confirm-modal" class="modal" style="display:none;">
  <div class="modal-overlay"></div>
  <div class="modal-content modal-small">
    <div class="modal-header">
      <h3>Confirm Action</h3>
      <button class="modal-close" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <p id="confirm-message">Are you sure?</p>
    </div>
    <div class="modal-footer">
      <button id="cancel-btn" class="btn btn-secondary">Cancel</button>
      <button id="confirm-btn" class="btn btn-danger">Confirm</button>
    </div>
  </div>
</div>

<!-- ==================== PREVIEW MODAL ==================== -->
<div id="preview-modal" class="modal" style="display:none;">
  <div class="modal-overlay"></div>
  <div class="modal-content modal-lg">
    <div class="modal-header">
      <h3>Image Preview</h3>
      <button class="modal-close" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" style="text-align:center;padding:1rem;">
      <img id="preview-modal-image" src="" alt="Preview" style="max-width:100%;max-height:70vh;border-radius:8px;">
    </div>
  </div>
</div>

<script src="js/admin.js"></script>
</body>
</html>
